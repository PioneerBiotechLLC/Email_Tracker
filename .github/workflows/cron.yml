# Every-15-minutes jobs for the serverless deployment (Vercel Hobby only allows daily crons).
# Secrets: APP_URL (e.g. https://tracker.example.com) and CRON_SECRET (same value as in Vercel).
# On Vercel Pro this call can move into apps/web/vercel.json as a "*/15 * * * *" cron instead.
# AI summaries are never made here: they are requested per thread in the app (or `pnpm ai:summarize` / `ai:backfill`).
name: cron
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check secrets
        run: |
          [ -n "$APP_URL" ] || { echo "::error::Repository secret APP_URL is not set (Settings > Secrets and variables > Actions)"; exit 1; }
          [ -n "$CRON_SECRET" ] || { echo "::error::Repository secret CRON_SECRET is not set (Settings > Secrets and variables > Actions)"; exit 1; }
      - name: Sync mailboxes (safety net)
        run: |
          curl -sS --fail-with-body --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/sync"
