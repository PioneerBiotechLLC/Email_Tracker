name: Vercel deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pick environment
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "VENV=production" >> "$GITHUB_ENV"; echo "PROD=--prod" >> "$GITHUB_ENV"
          else
            echo "VENV=preview" >> "$GITHUB_ENV"; echo "PROD=" >> "$GITHUB_ENV"
          fi
      - name: Pull Vercel settings and env vars
        run: vercel pull --yes --environment=$VENV --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build $PROD --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt $PROD --token=${{ secrets.VERCEL_TOKEN }}
